import groovy.json.JsonOutput
import java.nio.file.Files
import java.nio.file.StandardOpenOption

// Bounded to the real JVM/Android KotlinCompile API (verified with KGP 2.1.20).
// No configuration-name inference: libraries already carries Gradle transforms.
// Init scripts are also applied to included builds; the selected absolute
// project path belongs to the top-level build named on the command line.
if (gradle.parent == null) gradle.projectsEvaluated {
    def root = gradle.rootProject
    def required = { String name ->
        def value = root.findProperty(name)?.toString()
        if (!value) throw new GradleException("Kotlin/ETS: missing -P${name}")
        value
    }
    def module = required('kotlinEtsModule')
    def taskName = required('kotlinEtsCompileTask')
    def output = new File(required('kotlinEtsInputsOutput'))
    if (!module.startsWith(':')) throw new GradleException('Kotlin/ETS: module must be an absolute Gradle project path')
    if (taskName.contains(':')) throw new GradleException('Kotlin/ETS: compile task must be a local task name')
    if (!output.isAbsolute()) throw new GradleException('Kotlin/ETS: inputs output must be an absolute fresh path')
    if (output.exists()) throw new GradleException("Kotlin/ETS: inputs output already exists: ${output}")
    def project = root.findProject(module)
    if (project == null) throw new GradleException("Kotlin/ETS: module not found: ${module}")
    def compile = project.tasks.findByName(taskName)
    if (compile == null) throw new GradleException("Kotlin/ETS: compile task not found: ${module}:${taskName}")
    // Init scripts have a different classloader from project plugins. Check the
    // actual class hierarchy rather than importing a second KGP or duck typing.
    def type = compile.class
    while (type != null && type.name != 'org.jetbrains.kotlin.gradle.tasks.KotlinCompile') type = type.superclass
    if (type == null) throw new GradleException("Kotlin/ETS: ${compile.path} is not a supported JVM/Android KotlinCompile task (${compile.class.name})")
    def requestedVariant = root.findProperty('kotlinEtsVariant')?.toString()
    def android = project.extensions.findByName('android')
    def selectedVariant = null
    if (requestedVariant != null) {
        if (android == null || !(project.plugins.hasPlugin('com.android.application') || project.plugins.hasPlugin('com.android.library'))) {
            throw new GradleException("Kotlin/ETS: --variant requires an Android application or library module")
        }
        def variants = project.plugins.hasPlugin('com.android.application') ? android.applicationVariants : android.libraryVariants
        selectedVariant = variants.find { it.name == requestedVariant }
        if (selectedVariant == null) throw new GradleException("Kotlin/ETS: Android variant not found: ${requestedVariant}")
    }
    if (project.tasks.findByName('kotlinEtsCollectInputs') != null) {
        throw new GradleException("Kotlin/ETS: ${project.path} task kotlinEtsCollectInputs already exists")
    }
    project.tasks.register('kotlinEtsCollectInputs') {
        description = 'Collect actual Kotlin compile sources and resolved libraries without running that compile task'
        // Include producer dependencies, not the selected KotlinCompile action.
        // Resolving files happens in doLast, after these producers have run.
        dependsOn compile.sources.buildDependencies, compile.javaSources.buildDependencies, compile.libraries.buildDependencies
        // Compiler plugins such as KAPT can add generated classpath directories
        // through a direct task dependency without attaching builtBy metadata to
        // the file collection. Preserve the compile task's declared producer
        // graph while still excluding the compiler action itself.
        dependsOn {
            compile.taskDependencies.getDependencies(compile).findAll { dependency -> dependency != compile }
        }
        doLast { collectionTask ->
            def completedOutputs = [:]
            // Gradle 9 isolates project state during parallel configuration.
            // The finalized task graph already contains every transitive input
            // producer and can be inspected without querying another project.
            gradle.taskGraph.allTasks.each { producer ->
                if (producer == compile || producer == collectionTask) return
                def state = producer.state
                if (state.executed && state.failure == null && (!state.skipped || state.noSource || state.upToDate)) {
                    producer.outputs.files.files.each { file ->
                        completedOutputs[file.toPath().toAbsolutePath().normalize().toString()] = producer.path
                    }
                }
            }
            def omittedClasspath = []
            def checked = { Collection<File> files, String kind ->
                def paths = new LinkedHashSet<String>()
                files.each { file ->
                    def path = file.toPath().toAbsolutePath().normalize().toString()
                    // Producers may legally emit no classes. Never infer this
                    // from a plugin name, path suffix, or an unexecuted task.
                    if (kind == 'classpath' && !file.exists() && completedOutputs.containsKey(path)) {
                        omittedClasspath.add([path: path, producer: completedOutputs[path], reason: 'completed-producer-without-output'])
                        return
                    }
                    if (!file.exists() || !file.canRead()) {
                        throw new GradleException("Kotlin/ETS: ${compile.path} ${kind} path is missing or unreadable: ${file.absolutePath}")
                    }
                    paths.add(path)
                }
                paths.toList()
            }
            def sourceFiles = (compile.sources.files + compile.javaSources.files).findAll {
                it.name.endsWith('.kt') || it.name.endsWith('.java')
            }
            def sources = checked(sourceFiles, 'source').sort()
            if (sources.isEmpty()) throw new GradleException("Kotlin/ETS: ${compile.path} has no Kotlin/Java source files")
            if (sourceFiles.any { !it.isFile() }) throw new GradleException("Kotlin/ETS: ${compile.path} source input is not a file")
            def libraries = new ArrayList<File>(compile.libraries.files)
            if (android != null && (project.plugins.hasPlugin('com.android.application') || project.plugins.hasPlugin('com.android.library'))) {
                libraries.addAll(android.bootClasspath)
            }
            def classpath = checked(libraries, 'classpath')
            def resourceInputs = null
            if (selectedVariant != null) {
                def roots = []
                selectedVariant.sourceSets.eachWithIndex { sourceSet, priority ->
                    sourceSet.resDirectories.each { directory ->
                        if (directory.exists()) {
                            if (!directory.isDirectory() || !directory.canRead()) {
                                throw new GradleException("Kotlin/ETS: resource root is not a readable directory: ${directory.absolutePath}")
                            }
                            roots.add([sourceSet: sourceSet.name, overlayPriority: priority,
                                path: directory.toPath().toAbsolutePath().normalize().toString()])
                        }
                    }
                }
                def processResources = selectedVariant.outputs.collect { variantOutput ->
                    variantOutput.hasProperty('processResourcesProvider') ? variantOutput.processResourcesProvider.get() : null
                }.find { it != null && it.hasProperty('textSymbolOutputFile') }
                if (processResources == null) {
                    throw new GradleException("Kotlin/ETS: selected Android variant has no declared runtime symbol artifact")
                }
                def symbols = processResources.textSymbolOutputFile
                if (!symbols.isFile() || !symbols.canRead()) {
                    throw new GradleException("Kotlin/ETS: selected Android variant symbol artifact is missing: ${symbols.absolutePath}")
                }
                if (roots.isEmpty()) throw new GradleException("Kotlin/ETS: selected Android variant has no existing module resource roots")
                if (!android.namespace) throw new GradleException("Kotlin/ETS: selected Android module has no namespace")
                resourceInputs = [namespace: android.namespace, variant: selectedVariant.name,
                    roots: roots, symbols: symbols.toPath().toAbsolutePath().normalize().toString()]
            }
            def manifest = [schemaVersion: 2, project: root.projectDir.absolutePath,
                module: project.path, task: compile.path, sources: sources, classpath: classpath, omittedClasspath: omittedClasspath,
                compilerVersion: compile.class.classLoader.loadClass('org.jetbrains.kotlin.config.KotlinCompilerVersion').getField('VERSION').get(null),
                compilerArguments: compile.serializedCompilerArguments]
            if (resourceInputs != null) manifest.resourceInputs = resourceInputs
            Files.createDirectories(output.toPath().parent)
            try {
                Files.write(output.toPath(), (JsonOutput.prettyPrint(JsonOutput.toJson(manifest)) + '\n').getBytes('UTF-8'),
                    StandardOpenOption.CREATE_NEW, StandardOpenOption.WRITE)
            } catch (IOException error) {
                throw new GradleException("Kotlin/ETS: cannot write fresh inputs manifest ${output}: ${error.message}", error)
            }
        }
    }
}
